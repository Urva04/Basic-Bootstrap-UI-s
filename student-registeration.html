<html>
    <head>
        <title>Student Registration</title>
        <!--Bootstrap css CDN-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<style>
    body {
        background:linear-gradient(to right,#667eea,#764ba2);
        min-height: 100vh;
    }
    .card {
        border-radius: 20px;
        margin-top: 10px;
    }
    .form-control, .form-select {
        border-radius: 10px;
    }
    .btn-register {
        background: linear-gradient(to right, #667eea, #764ba2);
        border: none;
        border-radius: 30px;
        padding: 12px 30px;
    }
    .btn-register:hover{
        transform: translate(-2px) ;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

</style>
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="card p-4">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Student Registration</h2>
                            <p class="text-muted">Create your academic profile</p>
                        </div>
                        <form>
                            <div class="row g-4">
                                <!--first name column-->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        First Name
                                    </label>
                                    <div class="input-group">
                                    <span class="input-group-text icon-box"><i class="bi bi-person"></i>  
                                    </span>
                                    <input type="text" class="form-control" placeholder="Enter First Name">
                                    </div>
                                </div>
                                <!--Last name column-->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        Last Name
                                    </label>
                                    <div class="input-group">
                                    <span class="input-group-text icon-box"><i class="bi bi-person"></i>  
                                    </span>
                                    <input type="text" class="form-control" placeholder="Enter Second Name">
                                    </div>
                                </div>
                            </div>
                            <!--second row-->
                            <div class="row">
                                <!--Second name column-->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        Email
                                    </label>
                                    <div class="input-group">
                                    <span class="input-group-text icon-box"><i class="bi bi-envelope"></i>  
                                    </span>
                                    <input type="email" class="form-control" placeholder="example@gmail.com">
                                    </div>
                                </div>
                                <!--Phone number name column-->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        Phone Number
                                    </label>
                                    <div class="input-group">
                                    <span class="input-group-text icon-box"><i class="bi bi-phone"></i>  
                                    </span>
                                    <input type="text" class="form-control" placeholder="10 digit number">
                                    </div>
                                </div>
                            </div>
                            <!--third row-->
                            <div class="row">
                                <!--Third name column-->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        Course
                                    </label>
                                    <select class="form-select">
                                        <option disabled selected>Select Course</option>
                                        <option>BTech CSE</option>
                                        <option>Btech IT</option>
                                        <option>Btech cyber</option>
                                        <option>Btech AI</option>
                                        <option>BCA</option>
                                        <option>MCA</option>
                                      </select>
                                </div>
                                <!--Year of Study name column-->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        Year of Study
                                    </label>
                                    <select class="form-select">
                                        <option disabled selected>Select Year</option>
                                        <option>1st</option>
                                        <option>2nd</option>
                                        <option>3rd</option>
                                        <option>4th</option>
                                      </select>
                                </div>
                            </div>
                            <!--fourth row-->
                            <div class="row">
                                <!--fourth name column-->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        Password
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text icon-box"><i class="bi bi-lock"></i>  
                                        </span>
                                        <input type="password" class="form-control" placeholder="Create Password">
                                        </div>
                                
                                </div>
                                <!--confirm passsword-->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        Confirm Password
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text icon-box"><i class="bi bi-unlock"></i>  
                                        </span>
                                        <input type="password" class="form-control" placeholder="Re-enter passsword">
                                        </div>
                                </div>
                            </div>
                            <!--terms and condition-->
                            <div class="col-md-12">
                                <div class="form-check" class="form-check-input">
                                <input type="checkbox" class="form-check-label">
                                <label>I agree to the <a href="#">Terms & Conditions.</a></label>
                                </div>
                            </div>
                            <!--submit-->
                            <div class="col-md-12 text-center mt-4">
                                <button type="submit" class="btn btn-register btn-primary">Register Now</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
         </body>
