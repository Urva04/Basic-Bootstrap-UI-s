<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome for Icons  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f4f6f9; /* Light gray background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-card {
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 30px;
            background: white;
            border-radius: 8px;
        }

        .card-header-custom {
            font-size: 1.5rem;
            font-weight: 700;
            color: #212529;
            padding-bottom: 15px;
            margin-bottom: 0;
            border-bottom: none;
        }

        /* Input Styling to match screenshots */
        .form-control {
            border-radius: 4px;
            border: 1px solid #ced4da;
            height: 40px;
        }
        
        /* Specific Green Button */
        .btn-add {
            background-color: #198754;
            color: white;
            border: none;
            width: 80px;
            border-radius: 4px;
            font-weight: 600;
        }
        .btn-add:hover {
            background-color: #146c43;
            color: white;
        }

        /* Table Styling */
        .table-dark-styled th {
            background-color: #212529;
            color: white;
            font-weight: 600;
            border-top: none;
        }

        .row-border {
            border-bottom: 1px solid #e9ecef !important;
        }

        /* Action Buttons */
        .btn-edit {
            background-color: #ffc107; /* Yellow */
            border: none;
            color: #212529;
            font-weight: 600;
            border-radius: 4px;
            padding: 4px 12px;
        }
        .btn-edit:hover { background-color: #e0a800; color: black; }

        .btn-delete {
            background-color: #dc3545; /* Red */
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 4px;
            padding: 4px 12px;
        }
        .btn-delete:hover { background-color: #bb2d3b; color: white; }

        /* Inline editing input style */
        .inline-edit-input {
            border: 1px solid #0d6efd;
            padding: 2px 5px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card main-card p-4">
                    
                    <div class="d-flex justify-content-between align-items-start mb-4">
                        <h4 class="m-0">Student Manager</h4>
                        <span class="badge bg-secondary fs-6" id="totalRecords">Total: 0</span>
                    </div>

                    <!-- Controls Row -->
                    <div class="row g-2 mb-3">
                        <!-- Add Student Section -->
                        <div class="col-md-4 d-flex gap-2">
                            <input type="text" id="studentInput" class="form-control" placeholder="Enter student name">
                            <button id="addBtn" class="btn btn-add">Add</button>
                        </div>
                        
                        <!-- Search Section -->
                        <div class="col-md-5">
                            <input type="text" id="searchInput" class="form-control" placeholder="Search student...">
                        </div>
                        
                        <!-- Empty spacer if needed on large screens -->
                        <div class="col-md-3"></div> 
                    </div>

                    <!-- Data Table -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle table-dark-styled mb-0">
                            <thead>
                                <tr>
                                    <th scope="col">Name</th>
                                    <th scope="col" class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody">
                                <!-- Initial Dummy Data -->
                                <tr class="row-border">
                                    <td class="name-cell">John Doe</td>
                                    <td class="text-end pe-4">
                                        <button class="btn-edit edit-btn">Edit</button>
                                        <button class="btn-delete delete-btn">Delete</button>
                                    </td>
                                </tr>
                                <tr class="row-border">
                                    <td class="name-cell">Jane Doed</td>
                                    <td class="text-end pe-4">
                                        <button class="btn-edit edit-btn">Edit</button>
                                        <button class="btn-delete delete-btn">Delete</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        
                        <!-- Empty State (Hidden by default) -->
                        <div id="emptyState" class="text-center py-4 text-muted" style="display: none;">
                            No records found.
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts: jQuery & Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function(){

            // --- INITIALIZE ---
            updateTotalCount();


            // --- 1. ADD STUDENT LOGIC ---
            $('#addBtn').click(function(){
                let studentName = $('#studentInput').val().trim();

                if(studentName === ""){
                    alert("Please enter a name!");
                    return;
                }

                // Create new row HTML
                let newRow = `
                    <tr class="row-border">
                        <td class="name-cell">${studentName}</td>
                        <td class="text-end pe-4">
                            <button class="btn-edit edit-btn">Edit</button>
                            <button class="btn-delete delete-btn">Delete</button>
                        </td>
                    </tr>
                `;

                // Add to table top
                $('#studentTableBody').prepend(newRow);
                
                // Clear input
                $('#studentInput').val('');

                // Re-check empty state and count
                checkEmpty();
                updateTotalCount();
            });

            // Allow pressing Enter to add
            $('#studentInput').keypress(function(e){
                if(e.which == 13){
                    $('#addBtn').click();
                }
            });


            // --- 2. DELETE STUDENT LOGIC ---
            $(document).on('click', '.delete-btn', function(){
                // Animation for removal
                $(this).closest('tr').fadeOut(300, function(){
                    $(this).remove();
                    updateTotalCount();
                    checkEmpty();
                });
            });


            // --- 3. EDIT STUDENT LOGIC ---
            $(document).on('click', '.edit-btn', function(){
                let $row = $(this).closest('tr');
                let $nameCell = $row.find('.name-cell');
                let currentName = $nameCell.text();
                
                // Disable other actions while editing
                $row.find('.btn-delete').prop('disabled', true);

                // Replace text with input
                $nameCell.html(`<input type="text" class="inline-edit-input w-100" value="${currentName}">`);
                
                // Change button to "Save"
                let $editBtn = $(this);
                $editBtn.text("Save");
                $editBtn.removeClass('btn-edit').addClass('btn-primary'); // Switch to blue button
                
                // Auto focus input
                $nameCell.find('input').focus();

                // Handle Saving via Enter key or click
                $nameCell.find('input').keydown(function(e){
                    if(e.which == 13){
                        saveChanges($editBtn, $nameCell, $row);
                    }
                });
            });


            // Helper: Save Changes when "Save" is clicked
            function saveChanges(btn, cell, row){
                let newName = cell.find('input').val().trim();

                if(newName === ""){
                    alert("Name cannot be empty");
                    return;
                }

                // Update text
                cell.text(newName);
                
                // Reset button
                btn.text("Edit");
                btn.removeClass('btn-primary').addClass('btn-edit');
                
                // Re-enable delete
                row.find('.btn-delete').prop('disabled', false);
            }

            // Delegate click for Save button since it changes dynamically
            $(document).on('click', '.btn-primary', function(){
                let $btn = $(this);
                let $cell = $btn.closest('td').prev();
                let $row = $btn.closest('tr');
                saveChanges($btn, $cell, $row);
            });


            // --- 4. SEARCH FUNCTIONALITY ---
            $('#searchInput').on('keyup', function(){
                let value = $(this).val().toLowerCase();

                // Loop through rows
                $('#studentTableBody tr').filter(function(){
                    let rowText = $(this).find('.name-cell').text().toLowerCase();
                    $(this).toggle(rowText.indexOf(value) > -1);
                });

                updateTotalCount();
                checkEmpty(true); 
            });


            // --- HELPER FUNCTIONS ---

            function updateTotalCount(){
                // Only count visible rows
                let count = $('#studentTableBody tr:visible').length;
                $('#totalRecords').text("Total: " + count);
            }

            function checkEmpty(isSearching = false){
                let visibleRows = $('#studentTableBody tr:visible').length;
                
                if(visibleRows === 0){
                    $('#emptyState').show();
                } else {
                    $('#emptyState').hide();
                }
            }

        });
    </script>
</body>
</html>
